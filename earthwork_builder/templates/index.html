<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earthwork Builder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css" />
  <link rel="stylesheet" href="/static/builder.css" />
</head>
<body>
  <aside id="sidebar">
    <h1>Earthwork Builder</h1>

    <section>
      <h2>Sites</h2>
      <ul id="site-list"></ul>
      <details id="add-site">
        <summary>Add site</summary>
        <form id="add-site-form">
          <input name="name" placeholder="Name" required />
          <div class="row">
            <input name="lat" placeholder="Lat" type="number" step="any" required />
            <input name="lon" placeholder="Lon" type="number" step="any" required />
          </div>
          <input name="half_m" placeholder="Half-size m (default {{ default_half | int }})" type="number" step="any" />
          <input name="notes" placeholder="Notes" />
          <button type="submit">Add + download LiDAR</button>
        </form>
      </details>
    </section>

    <section id="site-panel" hidden>
      <h2 id="site-title"></h2>
      <p id="site-notes" class="muted"></p>
      <div id="job" class="muted"></div>
      <label class="check">
        <input type="checkbox" id="reviewed" />
        Reviewed — every earthwork in this window is outlined
      </label>
      <div class="row">
        <button id="save">Save</button>
        <span id="dirty" class="muted"></span>
      </div>
      <label>Hillshade opacity
        <input type="range" id="opacity" min="0" max="1" step="0.05" value="1" />
      </label>
      <h3>Outlines <span class="muted">(draw with the polygon tool, top-left)</span></h3>
      <p class="muted legend">
        <span class="swatch earthwork"></span>earthwork
        <span class="swatch negative"></span>look-alike (trained as "not an earthwork")
        <span class="swatch unverified"></span>unverified candidate
      </p>
      <ul id="label-list"></ul>
    </section>
  </aside>
  <div id="map"></div>

  <script>
    window.EW_TYPES = {{ types | tojson }};
    window.EW_NEGATIVES = {{ negatives | tojson }};
    window.EW_UNVERIFIED = {{ unverified | tojson }};
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script src="/static/builder.js"></script>
</body>
</html>
